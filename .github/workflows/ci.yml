name: Takween cross-platform smoke

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Takween
        uses: actions/checkout@v5
        with:
          path: Takween

      - name: Check out Baa
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Baa
          ref: 3a1956ce53921fb033ba410bc3a31976adb4d4ca
          path: Baa

      - name: Check out Nazm
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Nazm
          ref: f7fcf8f6d2bf629daf708b3b6028e22c74683ce6
          path: Nazm

      - name: Add Windows MinGW toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'C:\msys64\ucrt64\bin') {
              'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Configure Baa on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S Baa -B Baa/build-eco -G "MinGW Makefiles"

      - name: Configure Baa on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: cmake -S Baa -B Baa/build-eco -DCMAKE_BUILD_TYPE=Release

      - name: Configure Nazm on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S Nazm -B Nazm/build-eco -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Configure Nazm on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: cmake -S Nazm -B Nazm/build-eco -DCMAKE_BUILD_TYPE=Release

      - name: Build Baa
        run: cmake --build Baa/build-eco --parallel 2

      - name: Build Nazm
        run: cmake --build Nazm/build-eco --parallel 2

      - name: Run the shared Takween smoke suite
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $baa = Join-Path $env:GITHUB_WORKSPACE ("Baa/build-eco/baa" + $suffix)
          $nazm = Join-Path $env:GITHUB_WORKSPACE ("Nazm/build-eco/nazm" + $suffix)
          ./Takween/scripts/test_takween.ps1 -BaaPath $baa -NazmPath $nazm

  windows-installer:
    name: Standalone Windows installer
    needs: smoke
    runs-on: windows-latest
    steps:
      - name: Check out Takween
        uses: actions/checkout@v5
        with:
          path: Takween
      - name: Check out Baa
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Baa
          ref: 3a1956ce53921fb033ba410bc3a31976adb4d4ca
          path: Baa
      - name: Check out Nazm
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Nazm
          ref: f7fcf8f6d2bf629daf708b3b6028e22c74683ce6
          path: Nazm
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Add Windows MinGW toolchain
        shell: pwsh
        run: "'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append"
      - name: Build Baa and Nazm
        shell: pwsh
        run: |
          cmake -S Baa -B Baa/build-eco -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build Baa/build-eco --parallel 2
          cmake -S Nazm -B Nazm/build-eco -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build Nazm/build-eco --parallel 2
      - name: Prepare Baa private linker
        shell: pwsh
        run: ./Baa/scripts/prepare_gcc_bundle.ps1
      - name: Build standalone installer
        shell: pwsh
        run: |
          ./Takween/scripts/build_installer.ps1 -Version 0.1.0 `
            -BaaPath "$env:GITHUB_WORKSPACE\Baa\build-eco\baa.exe" `
            -BaaStdlibPath "$env:GITHUB_WORKSPACE\Baa\stdlib" `
            -NazmPath "$env:GITHUB_WORKSPACE\Nazm\build-eco\nazm.exe"
      - name: Verify install, project lifecycle, and uninstall
        shell: pwsh
        run: |
          ./Takween/scripts/test_installer.ps1 `
            -BaaDirectory "$env:GITHUB_WORKSPACE\Baa\build-eco" `
            -NazmDirectory "$env:GITHUB_WORKSPACE\Nazm\build-eco"
      - name: Upload standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: takween-setup-0.1.0-x64
          path: |
            Takween/dist/installer/takween-setup-0.1.0-x64.exe
            Takween/dist/installer/takween-setup-0.1.0-x64.exe.sha256
          if-no-files-found: error
